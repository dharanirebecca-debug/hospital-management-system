<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Profile</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;

            background: linear-gradient(
                135deg,
                #e0f7fa,
                #e8eaf6,
                #fce4ec
            );
        }

        .profile-box {
            max-width: 600px;
            margin: 60px auto;
            padding: 30px;

            background: white;
            border-radius: 20px;

            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
        }

        h1 {
            text-align: center;
        }

        .detail {
            padding: 15px;
            margin: 10px 0;

            background: #f5f5f5;
            border-radius: 10px;
        }

        .back-button {
            display: block;
            width: fit-content;
            margin: 25px auto 0;

            padding: 12px 25px;

            background: #007bff;
            color: white;

            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<script>
    if (
        sessionStorage.getItem("loggedIn") !== "true" ||
        sessionStorage.getItem("userRole") !== "patient"
    ) {
        window.location.href = "login.html";
    }
</script>

<div class="profile-box">

    <h1>👤 My Profile</h1>

    <div class="detail">
        <strong>Name:</strong>
        <span id="profileName"></span>
    </div>

    <div class="detail">
        <strong>Email:</strong>
        <span id="profileEmail"></span>
    </div>

    <div class="detail">
        <strong>Phone:</strong>
        <span id="profilePhone"></span>
    </div>

    <div class="detail">
        <strong>Username:</strong>
        <span id="profileUsername"></span>
    </div>

    <a href="patient-dashboard.html" class="back-button">
        ← Back to Dashboard
    </a>

</div>

<script>

let patientName =
    sessionStorage.getItem("patientName");

let registeredUsers =
    JSON.parse(
        localStorage.getItem("registeredUsers")
    ) || [];

let patient = registeredUsers.find(
    user => user.name === patientName
);

if (patient) {

    document.getElementById("profileName").innerText =
        patient.name;

    document.getElementById("profileEmail").innerText =
        patient.email;

    document.getElementById("profilePhone").innerText =
        patient.phone;

    document.getElementById("profileUsername").innerText =
        patient.username;

} else {

    document.getElementById("profileName").innerText =
        "Profile not found";

}

</script>

</body>
</html>
