<!DOCTYPE html>
<html>
<head>
    <title>Patient Management</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
            background: #f5f5f5;
        }

        h1, h2 {
            color: #333;
        }

        form {
            background: white;
            padding: 20px;
            border-radius: 10px;
            max-width: 500px;
            box-shadow: 0 0 8px #ccc;
        }

        input, select, textarea {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            margin-bottom: 12px;
            box-sizing: border-box;
        }

        button {
            padding: 8px 14px;
            margin: 3px;
            cursor: pointer;
        }

        table {
            width: 100%;
            background: white;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th, td {
            padding: 10px;
            border: 1px solid #999;
            text-align: left;
        }

        th {
            background: #eee;
        }

        #patientDetails {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 25px;
            border: 2px solid #333;
            border-radius: 10px;
            box-shadow: 0 0 15px #555;
            width: 350px;
            z-index: 1000;
        }
    </style>
</head>

<body>
    <script>
    if (
        sessionStorage.getItem("loggedIn") !== "true" ||
        sessionStorage.getItem("userRole") !== "patient"
    ) {
        window.location.href = "login.html";
    }
</script>

<h1>👤 Patient Management</h1>

<a href="index.html">🏠 Dashboard</a>

<hr>

<!-- ========================= -->
<!-- ADD PATIENT FORM -->
<!-- ========================= -->

<h2>➕ Add Patient</h2>

<form onsubmit="event.preventDefault(); handlePatientSubmit();">

    <label>Patient Name:</label>
    <input type="text" id="patientName" required>

    <label>Age:</label>
    <input type="number" id="age" required>

    <label>Gender:</label>
    <select id="gender" required>
        <option value="">Select Gender</option>
        <option value="Male">Male</option>
        <option value="Female">Female</option>
        <option value="Other">Other</option>
    </select>

    <label>Phone Number:</label>
    <input type="text" id="phone" required>

    <label>Email:</label>
    <input type="email" id="email" required>

    <label>Address:</label>
    <textarea id="address" required></textarea>

    <label>Disease:</label>
    <input type="text" id="disease" required>

    <button type="submit" id="patientSubmitButton">
        ➕ Add Patient
    </button>

    <button type="button"
            id="cancelPatientEditButton"
            onclick="cancelPatientEdit()"
            style="display:none;">
        ✖️ Cancel Edit
    </button>

</form>

<!-- ========================= -->
<!-- TOTAL PATIENTS -->
<!-- ========================= -->

<p>
    👤 <b>Total Patients:</b>
    <span id="patientTotal">0</span>
</p>

<!-- ========================= -->
<!-- PATIENT LIST -->
<!-- ========================= -->

<h2>📋 Patient List</h2>

<table>

    <thead>
        <tr>
            <th>Name</th>
            <th>Age</th>
            <th>Gender</th>
            <th>Phone</th>
            <th>Email</th>
            <th>Address</th>
            <th>Disease</th>
            <th>Action</th>
        </tr>
    </thead>

    <tbody id="patientList"></tbody>

</table>

<!-- ========================= -->
<!-- PATIENT DETAILS -->
<!-- ========================= -->

<div id="patientDetails">

    <h2>👤 Patient Details</h2>

    <p>
        <b>Name:</b>
        <span id="viewPatientName"></span>
    </p>

    <p>
        <b>Age:</b>
        <span id="viewPatientAge"></span>
    </p>

    <p>
        <b>Gender:</b>
        <span id="viewPatientGender"></span>
    </p>

    <p>
        <b>Phone:</b>
        <span id="viewPatientPhone"></span>
    </p>

    <p>
        <b>Email:</b>
        <span id="viewPatientEmail"></span>
    </p>

    <p>
        <b>Address:</b>
        <span id="viewPatientAddress"></span>
    </p>

    <p>
        <b>Disease:</b>
        <span id="viewPatientDisease"></span>
    </p>

    <button type="button" onclick="closePatientDetails()">
        ✖️ Close
    </button>

</div>


<script>

let editingPatientIndex = -1;


// =========================
// ADD / UPDATE
// =========================

function handlePatientSubmit() {

    if (editingPatientIndex === -1) {
        addPatient();
    } else {
        updatePatient();
    }
}


// =========================
// ADD PATIENT
// =========================

function addPatient() {

    let name =
        document.getElementById("patientName").value.trim();

    let age =
        document.getElementById("age").value;

    let gender =
        document.getElementById("gender").value;

    let phone =
        document.getElementById("phone").value.trim();

    let email =
        document.getElementById("email").value.trim();

    let address =
        document.getElementById("address").value.trim();

    let disease =
        document.getElementById("disease").value.trim();


    if (name === "" ||
        age === "" ||
        gender === "" ||
        phone === "" ||
        email === "" ||
        address === "" ||
        disease === "") {

        alert("Please fill all patient details!");
        return;
    }


    let patients =
        JSON.parse(localStorage.getItem("patients")) || [];


    patients.push({
        name: name,
        age: age,
        gender: gender,
        phone: phone,
        email: email,
        address: address,
        disease: disease
    });


    localStorage.setItem(
        "patients",
        JSON.stringify(patients)
    );


    resetPatientForm();

    displayPatients();

    alert("👤 Patient added successfully!");
}


// =========================
// DISPLAY PATIENTS
// =========================

function displayPatients() {

    let patients =
        JSON.parse(localStorage.getItem("patients")) || [];


    document.getElementById("patientTotal").textContent =
        patients.length;


    let list =
        document.getElementById("patientList");


    list.innerHTML = "";


    patients.forEach(function(patient, index) {

        let row =
            list.insertRow();


        row.insertCell(0).textContent =
            patient.name || "";

        row.insertCell(1).textContent =
            patient.age || "";

        row.insertCell(2).textContent =
            patient.gender || "";

        row.insertCell(3).textContent =
            patient.phone || "";

        row.insertCell(4).textContent =
            patient.email || "";

        row.insertCell(5).textContent =
            patient.address || "";

        row.insertCell(6).textContent =
            patient.disease || "";


        let actionCell =
            row.insertCell(7);


        actionCell.innerHTML =
            '<button type="button" onclick="viewPatient(' + index + ')">👁️ View</button> ' +
            '<button type="button" onclick="editPatient(' + index + ')">✏️ Edit</button> ' +
            '<button type="button" onclick="deletePatient(' + index + ')">🗑️ Delete</button>';
    });
}


// =========================
// VIEW PATIENT
// =========================

function viewPatient(index) {

    let patients =
        JSON.parse(localStorage.getItem("patients")) || [];


    let patient =
        patients[index];


    if (!patient) {

        alert("Patient not found!");

        return;
    }


    document.getElementById("viewPatientName").textContent =
        patient.name || "";

    document.getElementById("viewPatientAge").textContent =
        patient.age || "";

    document.getElementById("viewPatientGender").textContent =
        patient.gender || "";

    document.getElementById("viewPatientPhone").textContent =
        patient.phone || "";

    document.getElementById("viewPatientEmail").textContent =
        patient.email || "";

    document.getElementById("viewPatientAddress").textContent =
        patient.address || "";

    document.getElementById("viewPatientDisease").textContent =
        patient.disease || "";


    document.getElementById("patientDetails").style.display =
        "block";
}


// =========================
// CLOSE VIEW
// =========================

function closePatientDetails() {

    document.getElementById("patientDetails").style.display =
        "none";
}


// =========================
// EDIT PATIENT
// =========================

function editPatient(index) {

    let patients =
        JSON.parse(localStorage.getItem("patients")) || [];


    let patient =
        patients[index];


    if (!patient) {

        alert("Patient not found!");

        return;
    }


    document.getElementById("patientName").value =
        patient.name || "";

    document.getElementById("age").value =
        patient.age || "";

    document.getElementById("gender").value =
        patient.gender || "";

    document.getElementById("phone").value =
        patient.phone || "";

    document.getElementById("email").value =
        patient.email || "";

    document.getElementById("address").value =
        patient.address || "";

    document.getElementById("disease").value =
        patient.disease || "";


    editingPatientIndex =
        index;


    document.getElementById("patientSubmitButton").textContent =
        "✏️ Update Patient";


    document.getElementById("cancelPatientEditButton").style.display =
        "inline-block";


    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });
}


// =========================
// UPDATE PATIENT
// =========================

function updatePatient() {

    let patients =
        JSON.parse(localStorage.getItem("patients")) || [];


    if (!patients[editingPatientIndex]) {

        alert("Patient not found!");

        return;
    }


    let name =
        document.getElementById("patientName").value.trim();

    let age =
        document.getElementById("age").value;

    let gender =
        document.getElementById("gender").value;

    let phone =
        document.getElementById("phone").value.trim();

    let email =
        document.getElementById("email").value.trim();

    let address =
        document.getElementById("address").value.trim();

    let disease =
        document.getElementById("disease").value.trim();


    if (name === "" ||
        age === "" ||
        gender === "" ||
        phone === "" ||
        email === "" ||
        address === "" ||
        disease === "") {

        alert("Please fill all patient details!");

        return;
    }


    patients[editingPatientIndex] = {

        name: name,
        age: age,
        gender: gender,
        phone: phone,
        email: email,
        address: address,
        disease: disease
    };


    localStorage.setItem(
        "patients",
        JSON.stringify(patients)
    );


    resetPatientForm();

    displayPatients();


    alert("✏️ Patient updated successfully!");
}


// =========================
// CANCEL EDIT
// =========================

function cancelPatientEdit() {

    resetPatientForm();
}


// =========================
// RESET FORM
// =========================

function resetPatientForm() {

    document.getElementById("patientName").value = "";

    document.getElementById("age").value = "";

    document.getElementById("gender").value = "";

    document.getElementById("phone").value = "";

    document.getElementById("email").value = "";

    document.getElementById("address").value = "";

    document.getElementById("disease").value = "";


    editingPatientIndex = -1;


    document.getElementById("patientSubmitButton").textContent =
        "➕ Add Patient";


    document.getElementById("cancelPatientEditButton").style.display =
        "none";
}


// =========================
// DELETE PATIENT
// =========================

function deletePatient(index) {

    let patients =
        JSON.parse(localStorage.getItem("patients")) || [];


    if (!patients[index]) {

        alert("Patient not found!");

        return;
    }


    if (!confirm("Are you sure you want to delete this patient?")) {

        return;
    }


    patients.splice(index, 1);


    localStorage.setItem(
        "patients",
        JSON.stringify(patients)
    );


    displayPatients();


    alert("🗑️ Patient deleted successfully!");
}


// =========================
// LOAD PATIENTS
// =========================

displayPatients();

</script>

</body>
</html>
