<!DOCTYPE html>
<html>
<head>
    <title>Notification Management</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
            background: #f5f5f5;
        }

        h1, h2 {
            color: #333;
        }

        form {
            background: white;
            padding: 20px;
            border-radius: 10px;
            max-width: 500px;
            box-shadow: 0 0 8px #ccc;
        }

        label {
            font-weight: bold;
        }

        input, select, textarea {
            width: 100%;
            padding: 9px;
            margin-top: 5px;
            margin-bottom: 12px;
            box-sizing: border-box;
        }

        button {
            padding: 9px 15px;
            margin: 3px;
            cursor: pointer;
        }

        table {
            width: 100%;
            background: white;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th, td {
            padding: 10px;
            border: 1px solid #999;
            text-align: left;
        }

        th {
            background: #d9edf7;
        }

        #notificationDetails {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 25px;
            border: 2px solid #333;
            border-radius: 10px;
            box-shadow: 0 0 15px #555;
            width: 350px;
            z-index: 1000;
        }
    </style>
</head>

<body>

<h1>🔔 Notification Management</h1>

<a href="index.html">🏠 Dashboard</a>

<hr>

<h2>🔔 Add Notification</h2>

<form onsubmit="event.preventDefault(); handleNotificationSubmit();">

    <label>Patient Name:</label>
    <input type="text" id="patient" required>

    <label>Notification Type:</label>
    <select id="type" required>
        <option value="">Select Type</option>
        <option value="General">General</option>
        <option value="Appointment">Appointment</option>
        <option value="Medicine">Medicine</option>
        <option value="Emergency">Emergency</option>
    </select>

    <label>Message:</label>
    <textarea id="message" required></textarea>

    <label>Date:</label>
    <input type="date" id="date" required>

    <button type="submit" id="notificationSubmitButton">
        ➕ Add Notification
    </button>

    <button
        type="button"
        id="cancelNotificationEditButton"
        onclick="cancelNotificationEdit()"
        style="display:none;"
    >
        ✖️ Cancel Edit
    </button>

</form>

<p>
    🔔 <b>Total Notifications:</b>
    <span id="notificationTotal">0</span>
</p>

<h2>📋 Notification List</h2>

<table>

    <thead>
        <tr>
            <th>Patient</th>
            <th>Type</th>
            <th>Message</th>
            <th>Date</th>
            <th>Action</th>
        </tr>
    </thead>

    <tbody id="notificationList"></tbody>

</table>


<!-- VIEW POPUP -->

<div id="notificationDetails">

    <h2>🔔 Notification Details</h2>

    <p>
        <b>Patient:</b>
        <span id="viewNotificationPatient"></span>
    </p>

    <p>
        <b>Type:</b>
        <span id="viewNotificationType"></span>
    </p>

    <p>
        <b>Message:</b>
        <span id="viewNotificationMessage"></span>
    </p>

    <p>
        <b>Date:</b>
        <span id="viewNotificationDate"></span>
    </p>

    <button
        type="button"
        onclick="closeNotificationDetails()"
    >
        ✖️ Close
    </button>

</div>


<script>

let editingNotificationIndex = -1;


// ==========================================
// HANDLE FORM
// ==========================================

function handleNotificationSubmit() {

    if (editingNotificationIndex === -1) {
        addNotification();
    } else {
        updateNotification();
    }

}


// ==========================================
// ADD NOTIFICATION
// ==========================================

function addNotification() {

    let patient =
        document.getElementById("patient").value.trim();

    let type =
        document.getElementById("type").value;

    let message =
        document.getElementById("message").value.trim();

    let date =
        document.getElementById("date").value;


    if (
        patient === "" ||
        type === "" ||
        message === "" ||
        date === ""
    ) {
        alert("Please fill all notification details!");
        return;
    }


    let notifications =
        JSON.parse(
            localStorage.getItem("notifications")
        ) || [];


    notifications.push({

        patient: patient,
        type: type,
        message: message,
        date: date

    });


    localStorage.setItem(
        "notifications",
        JSON.stringify(notifications)
    );


    resetNotificationForm();

    displayNotifications();


    alert("🔔 Notification added successfully!");

}


// ==========================================
// DISPLAY NOTIFICATIONS
// ==========================================

function displayNotifications() {

    let notifications =
        JSON.parse(
            localStorage.getItem("notifications")
        ) || [];


    document.getElementById(
        "notificationTotal"
    ).textContent =
        notifications.length;


    let list =
        document.getElementById(
            "notificationList"
        );


    list.innerHTML = "";


    notifications.forEach(
        function(notification, index) {

            let row =
                list.insertRow();


            row.insertCell(0).textContent =
                notification.patient || "";


            row.insertCell(1).textContent =
                notification.type || "";


            row.insertCell(2).textContent =
                notification.message || "";


            row.insertCell(3).textContent =
                notification.date || "";


            let actionCell =
                row.insertCell(4);


            actionCell.innerHTML =

                '<button type="button" onclick="viewNotification(' +
                index +
                ')">👁️ View</button> ' +

                '<button type="button" onclick="editNotification(' +
                index +
                ')">✏️ Edit</button> ' +

                '<button type="button" onclick="deleteNotification(' +
                index +
                ')">🗑️ Delete</button>';

        }
    );

}


// ==========================================
// VIEW NOTIFICATION
// ==========================================

function viewNotification(index) {

    let notifications =
        JSON.parse(
            localStorage.getItem("notifications")
        ) || [];


    let notification =
        notifications[index];


    if (!notification) {

        alert("Notification not found!");

        return;
    }


    document.getElementById(
        "viewNotificationPatient"
    ).textContent =
        notification.patient || "";


    document.getElementById(
        "viewNotificationType"
    ).textContent =
        notification.type || "";


    document.getElementById(
        "viewNotificationMessage"
    ).textContent =
        notification.message || "";


    document.getElementById(
        "viewNotificationDate"
    ).textContent =
        notification.date || "";


    document.getElementById(
        "notificationDetails"
    ).style.display =
        "block";

}


// ==========================================
// CLOSE VIEW
// ==========================================

function closeNotificationDetails() {

    document.getElementById(
        "notificationDetails"
    ).style.display =
        "none";

}


// ==========================================
// EDIT NOTIFICATION
// ==========================================

function editNotification(index) {

    let notifications =
        JSON.parse(
            localStorage.getItem("notifications")
        ) || [];


    let notification =
        notifications[index];


    if (!notification) {

        alert("Notification not found!");

        return;
    }


    document.getElementById("patient").value =
        notification.patient || "";


    document.getElementById("type").value =
        notification.type || "";


    document.getElementById("message").value =
        notification.message || "";


    document.getElementById("date").value =
        notification.date || "";


    editingNotificationIndex = index;


    document.getElementById(
        "notificationSubmitButton"
    ).textContent =
        "✏️ Update Notification";


    document.getElementById(
        "cancelNotificationEditButton"
    ).style.display =
        "inline-block";


    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });

}


// ==========================================
// UPDATE NOTIFICATION
// ==========================================

function updateNotification() {

    let notifications =
        JSON.parse(
            localStorage.getItem("notifications")
        ) || [];


    if (!notifications[editingNotificationIndex]) {

        alert("Notification not found!");

        return;
    }


    let patient =
        document.getElementById("patient").value.trim();

    let type =
        document.getElementById("type").value;

    let message =
        document.getElementById("message").value.trim();

    let date =
        document.getElementById("date").value;


    if (
        patient === "" ||
        type === "" ||
        message === "" ||
        date === ""
    ) {

        alert("Please fill all notification details!");

        return;
    }


    notifications[editingNotificationIndex] = {

        patient: patient,
        type: type,
        message: message,
        date: date

    };


    localStorage.setItem(
        "notifications",
        JSON.stringify(notifications)
    );


    resetNotificationForm();

    displayNotifications();


    alert("✏️ Notification updated successfully!");

}


// ==========================================
// CANCEL EDIT
// ==========================================

function cancelNotificationEdit() {

    resetNotificationForm();

}


// ==========================================
// RESET FORM
// ==========================================

function resetNotificationForm() {

    document.getElementById("patient").value = "";

    document.getElementById("type").value = "";

    document.getElementById("message").value = "";

    document.getElementById("date").value = "";


    editingNotificationIndex = -1;


    document.getElementById(
        "notificationSubmitButton"
    ).textContent =
        "➕ Add Notification";


    document.getElementById(
        "cancelNotificationEditButton"
    ).style.display =
        "none";

}


// ==========================================
// DELETE NOTIFICATION
// ==========================================

function deleteNotification(index) {

    let notifications =
        JSON.parse(
            localStorage.getItem("notifications")
        ) || [];


    if (!notifications[index]) {

        alert("Notification not found!");

        return;
    }


    if (
        !confirm(
            "Are you sure you want to delete this notification?"
        )
    ) {
        return;
    }


    notifications.splice(index, 1);


    localStorage.setItem(
        "notifications",
        JSON.stringify(notifications)
    );


    displayNotifications();


    alert("🗑️ Notification deleted successfully!");

}


// ==========================================
// LOAD NOTIFICATIONS
// ==========================================

displayNotifications();

</script>

</body>
</html>
